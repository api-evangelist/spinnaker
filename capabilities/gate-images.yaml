naftiko: 1.0.0-alpha2
info:
  label: Spinnaker Gate API — Images
  description: 'Spinnaker Gate API — Images. 1 operations. Lead operation: Find Cloud Images. Self-contained Naftiko capability
    covering one Spinnaker business surface.'
  tags:
  - Spinnaker
  - Images
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SPINNAKER_API_KEY: SPINNAKER_API_KEY
capability:
  consumes:
  - type: http
    namespace: gate-images
    baseUri: http://localhost:8084
    description: Spinnaker Gate API — Images business capability. Self-contained, no shared references.
    resources:
    - name: images-find
      path: /images/find
      operations:
      - name: findimages
        method: GET
        description: Find Cloud Images
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: provider
          in: query
          type: string
          description: Cloud provider to search
        - name: account
          in: query
          type: string
          description: Cloud account to search within
        - name: region
          in: query
          type: string
          description: Cloud region to search within
        - name: q
          in: query
          type: string
          description: Search query string for image name filtering
    authentication:
      type: bearer
      token: '{{env.SPINNAKER_API_KEY}}'
  exposes:
  - type: rest
    namespace: gate-images-rest
    port: 8080
    description: REST adapter for Spinnaker Gate API — Images. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/images/find
      name: images-find
      description: REST surface for images-find.
      operations:
      - method: GET
        name: findimages
        description: Find Cloud Images
        call: gate-images.findimages
        with:
          provider: rest.provider
          account: rest.account
          region: rest.region
          q: rest.q
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: gate-images-mcp
    port: 9090
    transport: http
    description: MCP adapter for Spinnaker Gate API — Images. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: find-cloud-images
      description: Find Cloud Images
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: gate-images.findimages
      with:
        provider: tools.provider
        account: tools.account
        region: tools.region
        q: tools.q
      outputParameters:
      - type: object
        mapping: $.
